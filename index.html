<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FDFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1E1B18" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Curly">
<style>[hidden]{display:none!important}</style>
<title>Curly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* One calm surface. A big board; a dock with the few controls that matter.
   Portrait: board on top, dock below. Landscape: board left, dock right.
   Colours follow PrepTrack: warm orange on near-white, Focus palette in dark. */
:root{
  --bg:#FDFAF7; --card:#FFFFFF; --line:#EEE3D9; --fg:#231D17; --muted:#766A5F;
  --accent:#FF8A3D; --accent-ink:#1E1B18; --accent-text:#B8460A; --accent-soft:#FFEADB;
  --good:#1B7F47; --good-soft:#E2F4E9; --bad:#C2352F; --bad-soft:#FBE7E5;
  --pad:#FFFFFF; --scrim:rgba(35,29,23,.38);
  --ink:#231D17; --ink-r:#D92D20; --ink-b:#2459D6; --ink-g:#16803C; --ink-s:#A16207; --ink-m:#7C3AED;
  --shadow:0 10px 32px rgba(70,35,10,.16);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1E1B18; --card:#2A2622; --line:#3A342E; --fg:#F5EDE7; --muted:#A79A8E;
    --accent:#FF8A3D; --accent-ink:#1E1B18; --accent-text:#FF9D5C; --accent-soft:#3B2A1E;
    --good:#5CCB8A; --good-soft:#1F3328; --bad:#FF7D76; --bad-soft:#3B2424;
    --pad:#25211D; --scrim:rgba(0,0,0,.55);
    --ink:#F5EDE7; --ink-r:#FF8A80; --ink-b:#7FA8FF; --ink-g:#5ED08A; --ink-s:#F2C14E; --ink-m:#B79BFF;
    --shadow:0 10px 32px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1E1B18; --card:#2A2622; --line:#3A342E; --fg:#F5EDE7; --muted:#A79A8E;
  --accent:#FF8A3D; --accent-ink:#1E1B18; --accent-text:#FF9D5C; --accent-soft:#3B2A1E;
  --good:#5CCB8A; --good-soft:#1F3328; --bad:#FF7D76; --bad-soft:#3B2424;
  --pad:#25211D; --scrim:rgba(0,0,0,.55);
  --ink:#F5EDE7; --ink-r:#FF8A80; --ink-b:#7FA8FF; --ink-g:#5ED08A; --ink-s:#F2C14E; --ink-m:#B79BFF;
  --shadow:0 10px 32px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
sub,sup{line-height:0;font-size:.72em}
h1,h2,h3{margin:0;font-family:var(--f-display);letter-spacing:-.01em}
h1{font-weight:700;font-size:34px;line-height:1;letter-spacing:-.025em}
.sub{color:var(--muted);font-size:14px;margin:0}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}
#vHome{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--accent-soft);color:var(--accent-text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;min-height:38px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;align-items:center;gap:10px}.row.gap{gap:8px;flex-wrap:wrap}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.in{resize:vertical;min-height:64px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.check{display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent)}
.preview{font-size:13px;color:var(--muted);min-height:18px}

/* top bar */
.bar{flex:none;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(6px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.bar .ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.bar .ttl b{font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nameIn{flex:1;min-width:0;height:40px;border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:17px;padding:0 6px}
.nameIn:focus{outline:2px solid var(--accent);border-radius:8px}
.prog{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 6px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

/* stage: board + dock */
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.boardwrap{flex:1;min-height:0;position:relative;background:var(--pad);overflow:hidden;touch-action:none}
.dock{flex:none;max-height:44%;overflow-y:auto;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:10px}
.dock.slim{max-height:none}
.dockbody{display:flex;flex-direction:column;gap:8px}
.hint{margin:0;color:var(--muted);font-size:13px}
@media (min-aspect-ratio: 11/10){
  .stage{flex-direction:row}
  .dock{width:min(340px,40vw);max-height:none;height:100%;border-top:0;border-left:1px solid var(--line);padding-bottom:12px}
}

/* board svg */
svg.board{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.bd{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.bd.hot{stroke:var(--accent)}
.glow{fill:none;stroke:var(--accent);stroke-width:6;opacity:.5;stroke-linecap:round}
.glow.snap{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5;opacity:1}
.glow.sel{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2;opacity:1}
.atbg{fill:var(--pad)}
text.at{font:700 20px var(--f-body);fill:var(--ink)}
text.at.o{fill:var(--ink-r)}text.at.n{fill:var(--ink-b)}text.at.x{fill:var(--ink-g)}text.at.b{fill:var(--accent-text)}text.at.s{fill:var(--ink-s)}text.at.m{fill:var(--ink-m)}text.at.r{fill:var(--muted)}
.chg{fill:var(--pad);stroke:var(--ink);stroke-width:1.3}
.chgt{font:700 11px var(--f-body);fill:var(--ink)}
.lpd{fill:var(--ink)}
.stub{stroke:var(--muted);stroke-width:2;stroke-dasharray:3 4;stroke-linecap:round;opacity:.7}
.ar{fill:none;stroke:var(--ink-b);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ar.hit{stroke:transparent;stroke-width:24;pointer-events:stroke}
.ar.head{stroke-width:2.5}
.arw .ar.hit{stroke:transparent;stroke-width:24;opacity:1}
.ah{fill:var(--ink-b)}
.arw.ok .ar:not(.hit){stroke:var(--good)}.arw.ok .ah{fill:var(--good);stroke:none}
.arw.bad .ar:not(.hit){stroke:var(--bad)}.arw.bad .ah{fill:var(--bad);stroke:none}.arw.bad{animation:shake .4s}
.arw.tmp .ar:not(.hit){stroke-dasharray:6 6;opacity:.7}
.arw.new .ar:not(.hit){stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease forwards}
.arw.new .ah,.arw.new .ar.head{opacity:0;animation:pop .2s .7s forwards}
.arw.ok.new .ar:not(.hit){stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease forwards}
.arw.ok .ar.head{stroke:var(--good)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@keyframes shake{20%{transform:translateX(-5px)}50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
.rp{fill:var(--accent)}.rpt{font:700 12px var(--f-body);fill:var(--accent-ink)}

/* board overlay */
.hud{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:3}
.hudb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.hudb:disabled{opacity:.4}
.selbar{position:absolute;left:10px;right:10px;bottom:10px;display:none;gap:8px;align-items:center;overflow-x:auto;z-index:3;padding:6px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.selbar.on{display:flex}
.selname{font-family:var(--f-display);font-weight:700;padding:0 8px}
.capline{position:absolute;left:10px;right:10px;top:10px;max-width:calc(100% - 140px);z-index:2;font-size:14px;line-height:1.35;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.capbox{font-size:15px;line-height:1.4;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.capbox:empty{display:none}
.capline.big{right:10px;max-width:none;top:auto;bottom:10px;font-size:15px;box-shadow:var(--shadow)}
.capline b{font-weight:700}

/* dock pieces */
.seg{display:flex;padding:3px;border-radius:12px;background:var(--line)}
.seg button{flex:1;min-height:38px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.tray{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;touch-action:pan-x;scrollbar-width:none}
.tray::-webkit-scrollbar{display:none}
.pal{flex:none;min-width:52px;min-height:48px;padding:0 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:16px;touch-action:pan-x;user-select:none;-webkit-user-select:none}
.pal:active{background:var(--accent-soft)}
@media (min-aspect-ratio: 11/10){.tray{flex-wrap:wrap;overflow-x:hidden;touch-action:pan-y}.pal{touch-action:pan-y}}
.ghost{position:fixed;z-index:50;transform:translate(-50%,-130%);padding:10px 16px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;pointer-events:none;box-shadow:var(--shadow)}
.frames{display:flex;align-items:center;gap:10px}
.frames .chips{flex:1}
.arrowcount{font-size:14px}
.rxn{display:flex;gap:18px;flex-wrap:wrap}
.chem{font-size:15px;font-weight:500}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line);padding:0;position:relative}
.dot::after{content:"";position:absolute;inset:-12px}
.dot.past{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.dot.on{background:var(--accent)}
.ctl{display:flex;justify-content:center;align-items:center;gap:18px}
.ctlb{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line)}
.ctlb.big{width:64px;height:64px;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.ctlb:disabled{opacity:.4}

/* practice */
.q{display:flex;flex-direction:column;gap:6px}
.qtext{margin:0;font-size:15.5px}
.pips{display:flex;gap:6px}.pips i{width:22px;height:8px;border-radius:9px;background:var(--line)}.pips i.on{background:var(--good)}
.msg{min-height:20px;font-size:14px;font-weight:500}.msg.bad{color:var(--bad)}.msg.good{color:var(--good)}.msg.hint{color:var(--accent-text)}
.reveal{display:flex;flex-direction:column;gap:8px}
.rv{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 14px;border-radius:12px;border:1px dashed var(--line);background:var(--card);min-height:56px}
.rv .ans{font-weight:600;color:var(--muted)}.rv.on{border-style:solid}.rv.on .ans{color:var(--fg)}
.grade{display:flex;flex-direction:row;gap:8px}.grade .btn{flex:1}.grade.hide{display:none}
.sum{display:flex;flex-direction:column;gap:10px}
.srow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}

/* home */
.wrap{max-width:720px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 120px max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}
.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border-radius:18px;background:var(--accent-soft);margin-bottom:18px}
.hero b{font-family:var(--f-display);font-size:19px}
.cards{display:flex;flex-direction:column;gap:10px}
.mcard{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.mtop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.mtop b{font-family:var(--f-display);font-size:17px}
.pill{flex:none;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--muted)}
.pill.due{background:var(--accent);color:var(--accent-ink)}.pill.new{background:var(--good-soft);color:var(--good)}

.impbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px 16px;margin:-6px 0 18px;border-radius:16px;border:1px dashed var(--accent);background:var(--card)}
.impbtn svg{color:var(--accent-text)}.impbtn b{display:block;font-size:15px}.impbtn small{display:block;color:var(--muted);font-size:13px;margin-top:1px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}.thumb{position:relative;width:96px;height:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}.thumb .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;background:var(--scrim);color:#fff;font-size:18px;line-height:1}
.notes{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.lnk{color:var(--accent-text);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.photoov{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:calc(10px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.photoov .phbox{order:3;flex:1 0 100%;height:calc(100% - 56px);overflow:auto;border-radius:12px;border:1px solid var(--line);background:var(--card);touch-action:pan-x pan-y pinch-zoom}
.photoov img.fit{width:100%;height:100%;object-fit:contain;display:block}.photoov img.zoom{width:240%;display:block}
.empty{text-align:center;padding:40px 0;display:flex;flex-direction:column;gap:14px;align-items:center}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;height:56px;padding:0 22px 0 16px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700;box-shadow:var(--shadow);z-index:5}

/* sheets and toast */
#sheetHost{position:fixed;inset:0;z-index:40;display:none}
#sheetHost.on{display:block}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 6px}
.sheetact{display:flex;gap:10px;margin-top:6px}.sheetact .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);max-width:min(92vw,460px);padding:11px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.22s;z-index:60;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

</head>
<body>
<div id="app">
  <section id="vHome" class="screen"></section>
  <section id="vEdit" class="screen"></section>
  <section id="vPlay" class="screen"></section>
  <section id="vPractice" class="screen"></section>
</div>
<div id="sheetHost"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>

<script>
const $ = (s, r) => (r || document).querySelector(s);

const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function buzz(n) { try { navigator.vibrate && navigator.vibrate(n || 12); } catch (e) { /* not available */ } }
/* chemical text typed by hand: H2O -> H₂O, ->, hv, delta */
function fmt(s) {
  s = esc(s || '').replace(/-&gt;/g, '→').replace(/\bhv\b/g, 'hν').replace(/\bdelta\b/gi, 'Δ');

/* ===================================================================
   Chem engine. A scene is plain JSON: atoms, bonds, an id counter.
   Electrons are counted, not drawn: atom.ne = non-bonding electrons,
   bond.e = electrons in the bond (2 per order), atom.ov = open valences
   (bonds to "the rest", filled with H when the author finishes).
   Charge is always derived: V - ne - ov - sum(bond.e)/2.
   =================================================================== */
const BL = 56;                               // bond length in board units
const EL = {
  H: { V: 1, ne: 0, val: 1 }, B: { V: 3, ne: 0, val: 3 }, C: { V: 4, ne: 0, val: 4 }, N: { V: 5, ne: 2, val: 3 },
  O: { V: 6, ne: 4, val: 2 }, F: { V: 7, ne: 6, val: 1 }, Cl: { V: 7, ne: 6, val: 1 }, Br: { V: 7, ne: 6, val: 1 }, I: { V: 7, ne: 6, val: 1 },
  S: { V: 6, ne: 4, val: 2 }, P: { V: 5, ne: 2, val: 3 }, Li: { V: 1, ne: 0, val: 1 }, Na: { V: 1, ne: 0, val: 1 }, K: { V: 1, ne: 0, val: 1 },
  Mg: { V: 2, ne: 0, val: 2 }, Zn: { V: 2, ne: 0, val: 2 }, Hg: { V: 2, ne: 0, val: 2 }, Al: { V: 3, ne: 0, val: 3 }, Cr: { V: 6, ne: 0, val: 6 },
  R: { V: 1, ne: 0, val: 1 }

const METALS = new Set(['Li', 'Na', 'K', 'Mg', 'Zn', 'Hg', 'Al', 'Cr']);
/* one bond more than usual is allowed, using a lone pair (N+, O+, halonium) or an empty orbital (B-) */
const EXT = { N: 4, O: 3, Cl: 2, Br: 2, I: 2, B: 4 };
const LONEPAIR = new Set(['N', 'O', 'F', 'Cl', 'Br', 'I', 'S', 'P']);

const Sc = {
  make() { return { atoms: {}, bonds: {}, n: 1 }; },
  clone(S) { return JSON.parse(JSON.stringify(S)); },
  addAtom(S, el, x, y, o) { const id = 'a' + (S.n++), d = EL[el] || EL.C; S.atoms[id] = Object.assign({ id, el, x: x || 0, y: y || 0, ne: d.ne, ov: 0 }, o || {}); return id; },
  addBond(S, a, b, e) { const k = Sc.bondBetween(S, a, b); if (k) { k.e += (e || 2); return k.id; } const id = 'b' + (S.n++); S.bonds[id] = { id, a, b, e: e || 2 }; return id; },
  bondBetween(S, a, b) { for (const k in S.bonds) { const o = S.bonds[k]; if ((o.a === a && o.b === b) || (o.a === b && o.b === a)) return o; } return null; },
  adj(S) {                                    // atom id -> [{b: bond, o: other atom id}]
    const m = {}; for (const id in S.atoms) m[id] = [];
    for (const k in S.bonds) { const b = S.bonds[k]; if (m[b.a] && m[b.b]) { m[b.a].push({ b, o: b.b }); m[b.b].push({ b, o: b.a }); } }
    return m;
  },
  charge(S, id, A) {
    const a = S.atoms[id], d = EL[a.el] || EL.C; A = A || Sc.adj(S);
    let sh = 0; for (const x of A[id]) sh += x.b.e / 2;
    return d.V - a.ne - (a.ov || 0) - sh;
  },
  components(S, A) {
    A = A || Sc.adj(S); const seen = {}, out = [];
    for (const id in S.atoms) { if (seen[id]) continue; const st = [id], c = []; seen[id] = 1; while (st.length) { const u = st.pop(); c.push(u); for (const x of A[u]) if (!seen[x.o]) { seen[x.o] = 1; st.push(x.o); } } out.push(c); }
    return out;
  },
  remove(S, id) { delete S.atoms[id]; for (const k in S.bonds) { const b = S.bonds[k]; if (b.a === id || b.b === id) delete S.bonds[k]; } },
  bonds(S, id, A) { A = A || Sc.adj(S); let n = 0; for (const x of A[id]) n += x.b.e / 2; return n; },
  /* bonds still missing compared with the usual valence (C: 4, N: 3, O: 2 ...) */
  cap(S, id, A) { const a = S.atoms[id]; if (!a || METALS.has(a.el) || a.el === 'R') return 0; return Math.max(0, (EL[a.el] || EL.C).val - Sc.bonds(S, id, A)); },
  /* make room for one more bond: use a missing bond, give up a hydrogen, or (N, O, halogens, B) take one extra bond */
  consume(S, id, A) {

  canBond(S, id, A) {

  /* charge follows the bonds: lone pairs fill the octet on N, O, halogens; C and B keep none unless they had them */
  settle(S, ids) {

      const a = S.atoms[id]; if (!a || METALS.has(a.el) || a.el === 'R') continue; a.ov = 0; const b = Sc.bonds(S, id, A);
      if (a.el === 'H') { if (b > 0) a.ne = 0; }

  /* fill every open valence with hydrogen */
  finalize(S) {
    for (const id of Object.keys(S.atoms)) { const a = S.atoms[id]; while (a.ov > 0) { a.ov--; const h = Sc.addAtom(S, 'H', a.x, a.y); Sc.addBond(S, id, h, 2); } }
    layout.placeHs(S); return S;
  },
  /* a hydrogen drawn as part of its parent's label: one single bond, neutral, no lone pair */
  collapsible(S, id, A) {
    const a = S.atoms[id]; if (!a || a.el !== 'H' || a.ne || a.ov) return null;
    A = A || Sc.adj(S); const l = A[id]; if (l.length !== 1 || l[0].b.e !== 2) return null;
    const p = S.atoms[l[0].o]; if (!p || p.el === 'H') return null; return p.id;
  },
  /* which hydrogens are hidden right now: collapsible, parent not expanded, and not in `involved` */
  hiddenHs(S, involved, A) {
    A = A || Sc.adj(S); const h = {};
    for (const id in S.atoms) { const p = Sc.collapsible(S, id, A); if (p && !S.atoms[p].exp && !(involved && involved[id])) h[id] = p; }
    return h;
  },
  hsOf(S, id, A) { A = A || Sc.adj(S); return A[id].filter(x => S.atoms[x.o].el === 'H').map(x => x.o); },
  bbox(S, hidden, pad) {
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const id in S.atoms) { if (hidden && hidden[id]) continue; const a = S.atoms[id]; x0 = Math.min(x0, a.x); y0 = Math.min(y0, a.y); x1 = Math.max(x1, a.x); y1 = Math.max(y1, a.y); }
    if (x0 > x1) return [0, 0, 1, 1]; pad = pad || 0; return [x0 - pad, y0 - pad, x1 + pad, y1 + pad];
  },
  /* simple rings (3..8 atoms) among non-H atoms, each as an ordered id list */
  rings(S, A) {
    A = A || Sc.adj(S); const out = [], seen = new Set();
    for (const k in S.bonds) {
      const b = S.bonds[k]; if (S.atoms[b.a].el === 'H' || S.atoms[b.b].el === 'H') continue;

        const u = q.shift(); if (prev[u] !== null && Object.keys(prev).length > 0 && depth(prev, u) >= 7) continue;

  }
};

/* ---------------- tiny SMILES reader (enough for the app's molecules) ---------------- */

/* ---------------- layout ---------------- */

  embed(S, ids) {                              // first guess: breadth-first tree with 120-degree turns

        else if (kids.length === 2) angs = [dir - Math.PI / 3, dir + Math.PI / 3];
        else angs = kids.map((_, k) => dir + (k - (kids.length - 1) / 2) * Math.PI / 2.2);
        kids.forEach((x, k) => { const o = S.atoms[x.o]; o.x = a.x + BL * Math.cos(angs[k]); o.y = a.y + BL * Math.sin(angs[k]); done[x.o] = 1; q.push({ id: x.o, dir: angs[k], depth: depth + 1 }); });

  /* gentle spring layout. `ids`: atoms that may move (default all). `home`: 0..1 pull toward current spot. */
  relax(S, ids, o) {

/* ---------------- electron-pushing ---------------- */
/* arrow: {id, k:'p'|'f', from:{t:'lp',a}|{t:'b',b}, to:{t:'a',a,via?}|{t:'b',b}} */

      const b = S.bonds[f.b]; if (!b) { errs.push('missing bond'); continue; }
      useE[f.b] = (useE[f.b] || 0) + n; if (useE[f.b] > b.e) { errs.push('that bond has no electrons left to move'); continue; }

  /* ask the API which models this key can use: text+image, no tts / live / image generation */

/* ---------- what we ask for ---------- */
const GEM_PROMPT = `You turn a photo of a handwritten organic chemistry mechanism (a student's notebook page for JEE) into JSON. Reply with JSON only.

Read the page like a teacher would: which species react, which reagents and conditions are written, and which curly arrows are drawn, in what order. Use the student's own steps. Do not invent steps that are not on the page and do not "correct" the chemistry; if something is unclear, say so in "doubts".

ATOM-MAPPED SMILES
- Write every molecule as SMILES. Every atom that an arrow touches (as the start, the end, or either end of a bond that an arrow starts or ends on) must be written in brackets with its hydrogen count and a map number: [CH3:1][CH:2]=[CH2:3], [BH3:4], [OH-:5], [CH2+:6], [O:7]=[O+:8][O-:9].
- Charges go before the map number. Use only the elements C H B N O F Cl Br I S P Li Mg Zn Na K Al, and R for a generic group.
- If an arrow starts or ends on a hydrogen (for example a hydride moving from B-H), write that hydrogen as its own atom and bond it: [BH2:4][H:9]. Then B has two ordinary H plus the mapped one.
- Map numbers are unique within a step. The next step continues from the result of the arrows of the previous step with the SAME numbers, so keep numbering the same atoms the same way.
- Draw the full structure the student drew. Do not condense away atoms an arrow needs.

STEPS
"steps" is a list, in the order on the page. Each step has:
- "start": a list of SMILES for everything drawn at the start of this step, OR null when the step simply continues from the result of the previous step's arrows. The first step needs "start". A step that follows a "jump" step needs "start" too. A step also needs "start" when the student redraws the species in a different arrangement (for example after "this happens three times").
- "arrows": the curly arrows of this step, in order (may be empty).
- "note": one short sentence in plain words about what happens (what attacks what, what leaves).
- "jump": true only for a step with no arrows that says something like "repeats 3 times" or "same on the other groups". The next step then restarts from its own "start".

ARROWS
Each arrow is {"kind":"pair" or "fishhook","from":...,"to":...}. Use "pair" for a full curly arrow (two electrons) and "fishhook" for a half arrow (one electron).
"from" is either {"type":"bond","atoms":[a,b]} (the electrons of the bond between mapped atoms a and b) or {"type":"lonepair","atom":a}.
"to" is one of:
- {"type":"atom","atom":c} the electrons end on atom c. If they come from a bond and form a NEW bond from one end of that bond to c, add "via": the map number of that end (for example a pi bond C2=C3 attacking B: "from" bond [2,3], "to" atom B with "via": 3). If they come from a lone pair, they form a bond from that atom to c. If the arrow ends on one of the two atoms of its own source bond, the bond breaks and that atom takes the electrons as a lone pair (no "via").
- {"type":"bond","atoms":[a,b]} the electrons go into the bond between a and b (for example a lone pair becoming a pi bond, or a pi bond shifting into the neighbouring bond).
The arrow tail is on the electron source, the head on where they go.

OUTPUT
{
 "name": "short name of the reaction, as on the page",
 "chapter": one of ["Alkenes & alkynes","Haloalkanes","Alcohols, phenols & ethers","Aromatic compounds","Carbonyl compounds","Carboxylic acid derivatives","Amines","Radicals","Rearrangements","Other"],
 "reagents": "reagents as written, plain text, e.g. BH3 ; then H2O2",
 "conditions": "solvent, temperature, light, heat as written, or empty",
 "product": "name or formula of the final product(s)",
 "steps": [ ... ],
 "products": {"molecules": [SMILES of the final species, unmapped is fine], "note": "one short sentence"},
 "doubts": ["anything on the page you could not read or were unsure about"]
}
If the page shows several different reactions, import only the one the user names; if they name none, import the first complete one.`;

    title: 'Import from a photo', wide: true,
    nodes: [
      h('p', { class: 'sub' }, 'Photograph a notebook page with the mechanism. Curly asks Gemini to read it, then rebuilds each step and checks the arrows itself.'),
      h('div', { class: 'row gap' }, h('button', { class: 'btn', onclick: () => pick(true) }, 'Take a photo'), h('button', { class: 'btn', onclick: () => pick(false) }, 'Choose from gallery')),
      thumbs, h('label', { class: 'field' }, h('span', { class: 'lbl' }, 'Reaction on the page'), hint), go, status,
      h('p', { class: 'sub' }, `The photo goes to Google's Gemini (${esc(cfg.model)}) and is kept on this device with the mechanism so you can compare.`)
    ],
    actions: [{ label: 'Close', fn: () => { if (IM.ctl) IM.ctl.abort(); } }]
  });
  draw();
}
async function runImport(cfg) {
  if (IM.busy || !IM.photos.length) return; IM.busy = true; const st = $('#imStatus'), go = $('#imGo'); if (go) go.disabled = true;
  const t0 = Date.now(); let stage = 'Sending the photo…'; const tick = setInterval(() => { const s = $('#imStatus'); if (s) s.textContent = `${stage} ${Math.round((Date.now() - t0) / 1000)} s`; }, 500);
  IM.ctl = new AbortController(); const tm = setTimeout(() => IM.ctl.abort(), 150000);
  try {
    const { json, model } = await gemRead(cfg, IM.photos, IM.hint.trim(), IM.ctl.signal, m => { stage = 'Gemini is reading your page (' + m + '). This can take up to a minute.'; });
    stage = 'Checking every arrow…'; await sleep(30);
    const { m, notes } = buildImported(json, IM.photos[0].keep); void model;
    await App.save(m, true); renderHome(); IM.photos = []; IM.hint = ''; clearInterval(tick); clearTimeout(tm); IM.busy = false;
    const steps = m.frames.filter(f => f.arrows.length).length;
    openSheet({
      title: 'Imported', wide: true, body: `${m.name}: ${m.frames.length} frames, ${steps} with arrows. It stays out of practice until you have checked it.`,
      nodes: notes.length ? [h('p', { class: 'lbl' }, 'To check'), h('ul', { class: 'notes' }, ...notes.map(n => h('li', null, n)))] : [h('p', { class: 'sub' }, 'Every arrow worked out. Still, compare the steps with your photo.')],
      actions: [{ label: 'Later' }, { label: 'Check it', primary: true, fn: () => openEditor(App.byId(m.id), 'home') }]
    });
  } catch (e) {
    clearInterval(tick); clearTimeout(tm); IM.busy = false; const s = $('#imStatus'), g = $('#imGo'); if (g) g.disabled = false;
    if (e.name === 'AbortError') { if (s) s.textContent = 'Stopped.'; return; }
    if (s) s.textContent = e.user || ('Something went wrong: ' + e.message); console.error(e);
  }
}

function openGemSettings(thenImport) {
  GEM.load().then(cfg => {
    const key = h('input', { class: 'in', id: 'gKey', type: 'password', autocomplete: 'off', spellcheck: 'false', placeholder: 'Paste your Gemini API key', value: cfg.key }), msg = h('p', { class: 'sub', id: 'gMsg', role: 'status' });
    const sel = h('select', { class: 'in', id: 'gModel' }), custom = h('input', { class: 'in', id: 'gCustom', placeholder: 'or type a model id, e.g. gemini-3.8-flash', value: '' });
    const fill = list => { const ids = [...new Set([cfg.model, ...list, ...GEM.def.models])].filter(Boolean); sel.replaceChildren(...ids.map(x => h('option', { value: x, selected: x === cfg.model }, x))); };
    fill(cfg.models || []);
    const careful = h('input', { type: 'checkbox', id: 'gCare' }); careful.checked = !!cfg.careful;
    const check = async () => {
      const k = key.value.trim(); if (!k) { msg.textContent = 'Paste a key first.'; return; } msg.textContent = 'Checking the key…';
      try { const list = await GEM.listModels(k); cfg.models = list; if (!list.includes(cfg.model)) cfg.model = GEM.best(list) || cfg.model; fill(list); sel.value = cfg.model; msg.textContent = list.length ? `Key works. ${list.length} models found; ${cfg.model} selected.` : 'Key works, but no text models were listed. Type a model id below.'; }
      catch (e) { msg.textContent = e.user || 'Could not check the key.'; }
    };
    const saveIt = async () => { cfg.key = key.value.trim(); cfg.model = custom.value.trim() || sel.value || cfg.model; cfg.careful = careful.checked; await GEM.save(cfg); toast('Saved'); return cfg; };
    openSheet({
      title: 'Photo import', wide: true,
      nodes: [
        h('p', { class: 'sub' }, 'Curly uses your own Gemini API key. It is saved only on this device and is never part of a backup. A free key is available from Google AI Studio.'),
        h('a', { class: 'lnk', href: 'https://aistudio.google.com/apikey', target: '_blank', rel: 'noopener noreferrer' }, 'Get a key at aistudio.google.com/apikey'),
        h('label', { class: 'field' }, h('span', { class: 'lbl' }, 'API key'), key),
        h('button', { class: 'btn block', onclick: check }, 'Check key and find models'), msg,
        h('label', { class: 'field' }, h('span', { class: 'lbl' }, 'Model'), sel, custom),
        h('label', { class: 'check' }, careful, h('span', null, 'Read carefully (slower, better for messy handwriting)')),
        cfg.key ? h('button', { class: 'btn danger block', onclick: async () => { cfg.key = ''; await GEM.save(cfg); closeSheet(); toast('Key removed'); } }, 'Remove the key from this device') : null
      ],
      actions: [{ label: 'Close' }, { label: thenImport ? 'Save and continue' : 'Save', primary: true, fn: async () => { const c = await saveIt(); if (thenImport && c.key) importSheet(c); } }]
    });
  });
}

/* a look at the original page while checking the draft */
function showPhoto(m) {
  if (!m || !m.photo) return; let big = false;
  const img = h('img', { src: m.photo, alt: 'Notebook photo', class: 'fit' }), box = h('div', { class: 'phbox' }, img);
  const ov = h('div', { class: 'photoov', role: 'dialog', 'aria-label': 'Notebook photo' }, box, h('button', { class: 'btn sm', onclick: () => ov.remove() }, 'Close'), h('button', { class: 'btn sm', onclick: () => { big = !big; img.classList.toggle('fit', !big); img.classList.toggle('zoom', big); } }, 'Zoom'));
  document.body.append(ov);
}

/* ===================================================================
   Shell: screens, sheets, home, settings, install, boot.
   =================================================================== */
const ic = p => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  back: ic('<path d="M15 5l-7 7 7 7"/>'), close: ic('<path d="M6 6l12 12M18 6L6 18"/>'), edit: ic('<path d="M4 20h4L19 9l-4-4L4 16v4z"/>'),
  undo: ic('<path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12" transform="translate(0 -6)"/>'), tidy: ic('<path d="M4 7h16M4 12h10M4 17h16"/>'),
  fit: ic('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'), play: ic('<path d="M8 5l11 7-11 7V5z" fill="currentColor"/>'), pause: ic('<path d="M8 5v14M16 5v14"/>'),
  prev: ic('<path d="M6 5v14M19 5l-9 7 9 7V5z" fill="currentColor"/>'), next: ic('<path d="M18 5v14M5 5l9 7-9 7V5z" fill="currentColor"/>'),
  sliders: ic('<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'), plus: ic('<path d="M12 5v14M5 12h14"/>'),
  gear: ic('<circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'), trash: ic('<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>'), photo: ic('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/>')
};
const SCREENS = ['home', 'edit', 'play', 'practice'];
function show(name) { SCREENS.forEach(s => $('#v' + s[0].toUpperCase() + s.slice(1)).classList.toggle('on', s === name)); App.view = name; closeSheet(); window.scrollTo(0, 0); }
function goHome() { show('home'); renderHome(); }

/* ---------- sheets (no alert/confirm/prompt) ---------- */
function openSheet(o) {
  closeSheet(); const host = $('#sheetHost');
  const sh = h('div', { class: 'sheet' + (o.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' },
    h('div', { class: 'grab' }), h('h3', null, o.title), o.body ? h('p', { class: 'sub' }, o.body) : null, ...(o.nodes || []),
    h('div', { class: 'sheetact' }, ...(o.actions || [{ label: 'Close' }]).map(a => h('button', { class: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''), onclick: () => { closeSheet(); a.fn && a.fn(); } }, a.label))));
  host.replaceChildren(h('div', { class: 'scrim', onclick: closeSheet }), sh); host.classList.add('on'); return sh;
}
function closeSheet() { const host = $('#sheetHost'); host.classList.remove('on'); host.replaceChildren(); }

/* ---------- home ---------- */
function statusOf(m) { if (m.review) return { t: 'Check', c: 'draft' }; if (m.frames.length < 2) return { t: 'Draft', c: 'draft' }; if (!m.srs) return { t: 'New', c: 'new' }; if (isDue(m)) return { t: 'Due', c: 'due' }; const d = Math.max(1, Math.ceil((m.srs.due - Date.now()) / 864e5)); return { t: 'In ' + d + (d === 1 ? ' day' : ' days'), c: 'later' }; }
function renderHome() {
  const root = $('#vHome'); if (!root) return; root.replaceChildren();
  const list = App.mechs.slice().sort((a, b) => (isDue(b) ? 1 : 0) - (isDue(a) ? 1 : 0) || b.ts - a.ts), due = list.filter(m => m.frames.length > 1 && isDue(m)), st = streak();
  const wrap = h('div', { class: 'wrap' });
  wrap.append(
    h('div', { class: 'top' }, h('div', null, h('h1', null, 'Curly'), h('p', { class: 'sub' }, App.mechs.length ? `${App.mechs.length} mechanism${App.mechs.length > 1 ? 's' : ''}` + (st ? ` · ${st}-day streak` : '') : 'Your mechanisms, ready to practise')), h('button', { class: 'iconbtn', 'aria-label': 'Settings', onclick: openSettings, html: ICON.gear })),
    h('div', { class: 'hero' },
      h('div', null, h('b', null, due.length ? `${due.length} to practise` : 'All caught up'), h('p', { class: 'sub' }, due.length ? 'Recall the reagents, then push the electrons yourself.' : 'Add a mechanism or come back later.')),
      h('button', { class: 'btn primary', disabled: !due.length, onclick: () => startPractice() }, 'Practise')),
    h('button', { class: 'impbtn', onclick: openImport }, h('span', { html: ICON.photo }), h('span', null, h('b', null, 'Import from a photo'), h('small', null, 'Turn a notebook page into a mechanism'))));
  if (!list.length) wrap.append(h('div', { class: 'empty' }, h('p', null, 'No mechanisms yet.'), h('button', { class: 'btn primary', onclick: () => openEditor(null, 'home') }, 'Build your first')));
  const ul = h('div', { class: 'cards' });
  list.forEach(m => {
    const s = statusOf(m), steps = Math.max(0, m.frames.filter(f => f.arrows.length).length);
    ul.append(h('button', { class: 'mcard', onclick: () => m.frames.length > 1 ? openViewer(m) : openEditor(m, 'home') },
      h('div', { class: 'mtop' }, h('b', null, m.name || 'Untitled'), h('span', { class: 'pill ' + s.c }, s.t)),
      h('div', { class: 'sub' }, `${m.chapter} · ${steps} arrow step${steps === 1 ? '' : 's'}`),
      m.reagents ? h('div', { class: 'chem sub', html: fmt(m.reagents) + (m.conditions ? ' · ' + fmt(m.conditions) : '') }) : null));
  });
  wrap.append(ul);
  root.append(wrap, h('button', { class: 'fab', 'aria-label': 'New mechanism', onclick: () => openEditor(null, 'home'), html: ICON.plus + '<span>New</span>' }));
}
function openSettings() {
  const nodes = [];
  if (App.installEvt) nodes.push(h('button', { class: 'btn block', onclick: async () => { const e = App.installEvt; App.installEvt = null; closeSheet(); e.prompt(); try { await e.userChoice; } catch (x) { /* closed */ } } }, 'Install Curly on this device'));
  else if (/iphone|ipad/i.test(navigator.userAgent) && !navigator.standalone && !window.claude) nodes.push(h('p', { class: 'sub' }, 'To install on iPhone: Share, then Add to Home Screen.'));
  if (!window.claude) nodes.push(h('button', { class: 'btn block', onclick: () => { closeSheet(); openGemSettings(); } }, 'Photo import (Gemini key)'));
  nodes.push(h('button', { class: 'btn block', onclick: exportBackup }, 'Download a backup'), h('button', { class: 'btn block', onclick: () => $('#importFile').click() }, 'Restore from a backup'),
    h('button', { class: 'btn block', onclick: restoreSeeds }, 'Restore the starter mechanisms'),
    h('p', { class: 'sub' }, 'Everything is saved on this device. A backup lets you move it to another one.'));
  openSheet({ title: 'Settings', nodes, actions: [{ label: 'Close' }] });
}
async function restoreSeeds() { for (const f of [seedHydroboration, seedOzonolysis]) { const m = f(); const ex = App.byId(m.id); if (ex) m.srs = ex.srs; await App.save(m, true); } renderHome(); toast('Starter mechanisms restored'); }
async function exportBackup() {
  const data = JSON.stringify({ app: 'curly', v: 2, exported: new Date().toISOString(), mechanisms: App.mechs, profile: App.profile });
  const name = 'curly-backup-' + dayKey() + '.json'; const blob = new Blob([data], { type: 'application/json' });
  try {
    if (window.claude && window.claude.use) { const dl = await window.claude.use('downloads'); await dl.save(name, data, 'application/json'); }
    else { const a = h('a', { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click(); a.remove(); }
    toast('Backup downloaded');
  } catch (e) { toast('Could not download the backup'); }
}
async function importBackup(file) {
  try {
    const o = JSON.parse(await file.text()); if (o.app !== 'curly' || !Array.isArray(o.mechanisms)) throw new Error('not a backup');
    for (const m of o.mechanisms) { if (m && m.id && Array.isArray(m.frames)) await App.save(m, true); }
    if (o.profile && o.profile.days) { for (const k in o.profile.days) App.profile.days[k] = Math.max(App.profile.days[k] || 0, o.profile.days[k]); await DB.setMeta('profile', App.profile); }
    renderHome(); toast('Backup restored');
  } catch (e) { toast('That file is not a Curly backup.'); }
}

/* ---------- install as an app (standalone copy only) ---------- */
function initPwa() {
  if (window.claude || !/^https?:$/.test(location.protocol)) return;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); App.installEvt = e; });
  if (typeof ICONS !== 'undefined') {
    const base = location.href.split('#')[0].split('?')[0];
    const man = { name: 'Curly', short_name: 'Curly', description: 'Learn organic reaction mechanisms by pushing the electrons yourself.', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone', orientation: 'any', background_color: '#1E1B18', theme_color: '#1E1B18',
      icons: [{ src: ICONS.i192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: ICONS.i512, sizes: '512x512', type: 'image/png', purpose: 'any' }, { src: ICONS.m512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
    const link = h('link', { rel: 'manifest', href: 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(man)) }); document.head.append(link);
    document.head.append(h('link', { rel: 'apple-touch-icon', href: ICONS.a180 }));
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* ---------- boot ---------- */
async function boot() {
  $('#importFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
  initPwa(); await DB.open();
  App.profile = (await DB.getMeta('profile')) || { days: {} };
  let list = await DB.all();
  if (!list.length && !(await DB.getMeta('seeded'))) {
    for (const f of [seedHydroboration, seedOzonolysis]) { try { const m = f(); await DB.put(m); list.push(m); } catch (e) { console.error(e); } }
    await DB.setMeta('seeded', 1);
  }
  App.mechs = list; goHome(); window.__ready = true;
}
boot();
</script>
