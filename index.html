/* Notebook Ink. Ruled paper, ink-blue pen, red margin. Light = cream paper, dark = midnight paper with chalk ink.
   Token names are kept from the first version so every screen follows the theme. */
:root{
  --bg:#fbf7ea; --card:#fffdf5; --line:#d3dbe9; --fg:#1c2b5e; --muted:#6b78a8;
  --edge:#1c2b5e; --rule:#c6d9ee; --margin:#ee8b8b; --sh:rgba(28,43,94,.2);
  --accent:#2848c8; --accent-ink:#ffffff; --accent-text:#2848c8; --accent-soft:#fff3c4;
  --good:#1f8a4e; --good-soft:#e4f5e6; --bad:#d44a4a; --bad-soft:#ffe9e7;
  --pad:#fffdf5; --scrim:rgba(28,43,94,.38);
  --ink:#1c2b5e; --ink-r:#d44a4a; --ink-b:#2848c8; --ink-g:#1f8a4e; --ink-s:#a16207; --ink-m:#7c3aed;
  --shadow:0 10px 32px rgba(28,43,94,.22);
  --r1:225px 14px 255px 14px/14px 255px 14px 225px; --r2:14px 255px 14px 225px/225px 14px 255px 14px;
  --f-display:"Caveat","Segoe Print","Bradley Hand",cursive;
  --f-board:"Inter",ui-sans-serif,system-ui,sans-serif; --ds:1;
  --f-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151b30; --card:#1e2644; --line:#2b3558; --fg:#e8e3cf; --muted:#9aa6d4;
    --edge:#e8e3cf; --rule:#232d4d; --margin:#c9565a; --sh:rgba(0,0,0,.45);
    --accent:#5877ee; --accent-ink:#ffffff; --accent-text:#8fa6ff; --accent-soft:#3a3519;
    --good:#5fd394; --good-soft:#1f4535; --bad:#ff7d76; --bad-soft:#4a2a28;
    --pad:#1a2140; --scrim:rgba(0,0,0,.6);
    --ink:#e8e3cf; --ink-r:#ff7d76; --ink-b:#7f98f5; --ink-g:#5fd394; --ink-s:#f0c55a; --ink-m:#b7a7ff;
    --shadow:0 10px 32px rgba(0,0,0,.55); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151b30; --card:#1e2644; --line:#2b3558; --fg:#e8e3cf; --muted:#9aa6d4;
  --edge:#e8e3cf; --rule:#232d4d; --margin:#c9565a; --sh:rgba(0,0,0,.45);
  --accent:#5877ee; --accent-ink:#ffffff; --accent-text:#8fa6ff; --accent-soft:#3a3519;
  --good:#5fd394; --good-soft:#1f4535; --bad:#ff7d76; --bad-soft:#4a2a28;
  --pad:#1a2140; --scrim:rgba(0,0,0,.6);
  --ink:#e8e3cf; --ink-r:#ff7d76; --ink-b:#7f98f5; --ink-g:#5fd394; --ink-s:#f0c55a; --ink-m:#b7a7ff;
  --shadow:0 10px 32px rgba(0,0,0,.55); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
sub,sup{line-height:0;font-size:.72em}
h1,h2,h3{margin:0;font-family:var(--f-display);letter-spacing:-.01em}
h1{font-weight:700;font-size:34px;line-height:1;letter-spacing:-.025em}
.sub{color:var(--muted);font-size:14px;margin:0}
.lbl{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
#app{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
.screen.on{display:flex}
#vHome{overflow-y:auto;-webkit-overflow-scrolling:touch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--accent-soft);color:var(--accent-text)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;min-height:38px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;align-items:center;gap:10px}.row.gap{gap:8px;flex-wrap:wrap}
.in{width:100%;min-height:46px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.in:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea.in{resize:vertical;min-height:64px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.check{display:flex;gap:10px;align-items:flex-start;margin:6px 0 14px;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent)}
.preview{font-size:13px;color:var(--muted);min-height:18px}

/* top bar */
.bar{flex:none;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(6px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--bg)}
.bar .ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.bar .ttl b{font-family:var(--f-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nameIn{flex:1;min-width:0;height:40px;border:0;background:transparent;font-family:var(--f-display);font-weight:700;font-size:17px;padding:0 6px}
.nameIn:focus{outline:2px solid var(--accent);border-radius:8px}
.prog{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 6px}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}

/* stage: board + dock */
.stage{flex:1;min-height:0;display:flex;flex-direction:column}
.boardwrap{flex:1;min-height:0;position:relative;background:var(--pad);overflow:hidden;touch-action:none}
.dock{flex:none;max-height:44%;overflow-y:auto;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:10px}
.dock.slim{max-height:none}
.dockbody{display:flex;flex-direction:column;gap:8px}
.hint{margin:0;color:var(--muted);font-size:13px}
@media (min-aspect-ratio: 11/10){
  .stage{flex-direction:row}
  .dock{width:min(340px,40vw);max-height:none;height:100%;border-top:0;border-left:1px solid var(--line);padding-bottom:12px}
}

/* board svg */
svg.board{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.bd{stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.bd.hot{stroke:var(--accent)}
.glow{fill:none;stroke:var(--accent);stroke-width:6;opacity:.5;stroke-linecap:round}
.glow.snap{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2.5;opacity:1}
.glow.sel{fill:var(--accent-soft);stroke:var(--accent);stroke-width:2;opacity:1}
.atbg{fill:var(--pad)}
text.at{font:700 20px var(--f-board);fill:var(--ink)}
text.at.o{fill:var(--ink-r)}text.at.n{fill:var(--ink-b)}text.at.x{fill:var(--ink-g)}text.at.b{fill:var(--accent-text)}text.at.s{fill:var(--ink-s)}text.at.m{fill:var(--ink-m)}text.at.r{fill:var(--muted)}
.chg{fill:var(--pad);stroke:var(--ink);stroke-width:1.3}
.chgt{font:700 11px var(--f-board);fill:var(--ink)}
.lpd{fill:var(--ink)}
.stub{stroke:var(--muted);stroke-width:2;stroke-dasharray:3 4;stroke-linecap:round;opacity:.7}
.ar{fill:none;stroke:var(--ink-b);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ar.hit{stroke:transparent;stroke-width:24;pointer-events:stroke}
.ar.head{stroke-width:2.5}
.arw .ar.hit{stroke:transparent;stroke-width:24;opacity:1}
.ah{fill:var(--ink-b)}
.arw.ok .ar:not(.hit){stroke:var(--good)}.arw.ok .ah{fill:var(--good);stroke:none}
.arw.bad .ar:not(.hit){stroke:var(--bad)}.arw.bad .ah{fill:var(--bad);stroke:none}.arw.bad{animation:shake .4s}
.arw.tmp .ar:not(.hit){stroke-dasharray:6 6;opacity:.7}
.arw.new .ar:not(.hit){stroke-dasharray:1;stroke-dashoffset:1;animation:draw .8s ease forwards}
.arw.new .ah,.arw.new .ar.head{opacity:0;animation:pop .2s .7s forwards}
.arw.ok.new .ar:not(.hit){stroke-dasharray:1;stroke-dashoffset:1;animation:draw .5s ease forwards}
.arw.ok .ar.head{stroke:var(--good)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@keyframes shake{20%{transform:translateX(-5px)}50%{transform:translateX(5px)}80%{transform:translateX(-3px)}}
.rp{fill:var(--accent)}.rpt{font:700 12px var(--f-board);fill:var(--accent-ink)}

/* board overlay */
.hud{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:3}
.hudb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--muted);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.hudb:disabled{opacity:.4}
.selbar{position:absolute;left:10px;right:10px;bottom:10px;display:none;gap:8px;align-items:center;overflow-x:auto;z-index:3;padding:6px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.selbar.on{display:flex}
.selname{font-family:var(--f-display);font-weight:700;padding:0 8px}
.capline{position:absolute;left:10px;right:10px;top:10px;max-width:calc(100% - 140px);z-index:2;font-size:14px;line-height:1.35;padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.capbox{font-size:15px;line-height:1.4;padding:10px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.capbox:empty{display:none}
.capline.big{right:10px;max-width:none;top:auto;bottom:10px;font-size:15px;box-shadow:var(--shadow)}

/* light / dark / follow the device */
/* look style: Notebook (ruled paper, handwriting) or Classic (the first orange look) */

   Electrons are counted, not drawn: atom.ne = non-bonding electrons,
   bond.e = electrons in the bond (2 per order), atom.ov = open valences

  S: { V: 6, ne: 4, val: 2 }, P: { V: 5, ne: 2, val: 3 }, Li: { V: 1, ne: 0, val: 1 }, Na: { V: 1, ne: 0, val: 1 }, K: { V: 1, ne: 0, val: 1 },
  Mg: { V: 2, ne: 0, val: 2 }, Zn: { V: 2, ne: 0, val: 2 }, Hg: { V: 2, ne: 0, val: 2 }, Al: { V: 3, ne: 0, val: 3 }, Cr: { V: 6, ne: 0, val: 6 },

const LONEPAIR = new Set(['N', 'O', 'F', 'Cl', 'Br', 'I', 'S', 'P']);

/* ---------------- tiny SMILES reader (enough for the app's molecules) ---------------- */
function smiles(S, smi, ox, oy, maps) {

    const id = Sc.addAtom(S, el, 0, 0); meta[id] = { br, q: q || 0, hn: hn || 0 }; ids.push(id);

/* ------------------------- palette drag and drop ------------------------- */
function trayItem(it) {

  let st = null, ghost = null;
  const cleanup = () => { if (ghost) ghost.remove(); ghost = null; st = null; Ed.cand = null; Ed.rp = null; if (Ed.board) { redrawEd(); } };
  b.addEventListener('pointerdown', e => { st = { id: e.pointerId, x: e.clientX, y: e.clientY, moved: false }; });
  b.addEventListener('pointermove', e => {
    if (!st || st.id !== e.pointerId) return; const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.moved) { if (Math.hypot(dx, dy) < 9) return; st.moved = true; b.setPointerCapture(e.pointerId); ghost = h('div', { class: 'ghost' }, b.textContent); document.body.append(ghost); }

/* ------------------------- board gestures ------------------------- */
Ed.handler = {
  down(e, w, hit) {
    const f = curFrame(), S = f.scene;

      return false;
    }
    // arrows
    if (!hit) return false;
    if (hit.t === 'lp') { Ed.src = { t: 'lp', a: hit.a, k: hit.k }; return true; }
    if (hit.t === 'b') { Ed.src = { t: 'b', b: hit.b }; return true; }

      const A = Sc.adj(S), hid = Sc.hiddenHs(S, involvedOf(f), A), hasH = Object.values(hid).includes(hit.a);

  move(e, w, c) {

function ensureLayout(m) {

  try {
    let prev = null;
    for (const f of m.frames) {
      const S = f.scene; if (!S || !S.atoms) continue;
      if (prev) for (const id in S.atoms) { const q = prev.atoms[id]; if (q) { S.atoms[id].x = q.x; S.atoms[id].y = q.y; } }

      if (f.arrows && f.arrows.length) { try { layout.dock(S, f.arrows); } catch (e) { /* leave as is */ } }
      prev = S;

/* ===================================================================
   Photo import: a page of your notebook -> a draft mechanism.
   Gemini reads the page and answers with atom-mapped SMILES and the
   arrows between mapped atoms. Curly's own engine then rebuilds every
   step, so each arrow is checked and the products are computed, not
   copied. Whatever does not check out is dropped and listed for review.
   =================================================================== */
const GEM = {
  base: 'https://generativelanguage.googleapis.com/v1beta/',
  def: { key: '', model: 'gemini-3.8-flash', careful: true, models: [] },
  async load() { return Object.assign({}, this.def, (await DB.getMeta('gemini')) || {}); },
  async save(c) { await DB.setMeta('gemini', c); },
  ver: id => { const m = /gemini-(\d+(?:\.\d+)*)/.exec(id); return m ? m[1].split('.').map(Number) : [0]; },
  cmp(a, b) { const x = GEM.ver(a), y = GEM.ver(b); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (y[i] || 0) - (x[i] || 0); if (d) return d; } return 0; },
  /* ask the API which models this key can use: text+image, no tts / live / image generation */
  async listModels(key) {
    const out = []; let tok = '';

      const r = await fetch(this.base + 'models?pageSize=200' + (tok ? '&pageToken=' + encodeURIComponent(tok) : ''), { headers: { 'x-goog-api-key': key } });
      const j = await r.json().catch(() => ({})); if (!r.ok) throw gemErr(r.status, j);
      for (const m of j.models || []) {
        const id = String(m.name || '').replace(/^models\//, '');
        if (/^gemini-/.test(id) && (m.supportedGenerationMethods || []).includes('generateContent') && !/image|tts|live|audio|embed|transcribe|robotics|omni|nano|banana|research|computer|translate|customtools/.test(id)) out.push(id);
      }

  best(list) { return list.find(x => /flash/.test(x) && !/lite|preview|exp/.test(x)) || list.find(x => /flash/.test(x)) || list[0] || ''; }
};

  const ri = ((j && j.error && j.error.details) || []).find(d => d && d.retryDelay); e.retry = ri ? Math.ceil(parseFloat(ri.retryDelay) || 0) : 0;

/* ---------- what we ask for ---------- */
const GEM_PROMPT_T = `You turn a photo of a handwritten organic chemistry mechanism (a student's notebook page for JEE) into JSON. Reply with JSON only.

Read the page like a teacher would: which species react, which reagents and conditions are written, and which curly arrows are drawn, in what order.

FOLLOW THE PAGE EXACTLY - THIS IS THE MOST IMPORTANT RULE
- Many reactions have two or three accepted mechanisms. The student must learn the one their teacher taught, which is the one on this page. So copy the page step by step. Do NOT use the mechanism you know from a textbook, do NOT merge, split, reorder, add or skip steps, and do NOT "correct" the chemistry.
- Never assume or fill in a step, an intermediate, a charge, a lone pair or an arrow that is not drawn. If the page does not show it, leave it out.
- If anything is unclear or seems missing (a smudged arrow, an unclear structure, an arrow that could start from two places), do not guess: write it in "doubts" and import only what is certain.

ATOM-MAPPED SMILES
- Write every molecule as SMILES. Every atom that an arrow touches (as the start, the end, or either end of a bond that an arrow starts or ends on) must be written in brackets with its hydrogen count and a map number: [CH3:1][CH:2]=[CH2:3], [BH3:4], [OH-:5], [CH2+:6], [O:7]=[O+:8][O-:9].
- Charges go before the map number. Use only the elements C H B N O F Cl Br I S P Li Mg Zn Na K Al, and R for a generic group.
- If an arrow starts or ends on a hydrogen (for example a hydride moving from B-H), write that hydrogen as its own atom and bond it: [BH2:4][H:9]. Then B has two ordinary H plus the mapped one.
- Map numbers are unique within a step. The next step continues from the result of the arrows of the previous step with the SAME numbers, so keep numbering the same atoms the same way.
- Draw the full structure the student drew. Do not condense away atoms an arrow needs.

STEPS
"steps" is a list, in the order on the page. Each step has:
- "start": a list of SMILES for everything drawn at the start of this step, OR null when the step simply continues from the result of the previous step's arrows. The first step needs "start". A step that follows a "jump" step needs "start" too. A step also needs "start" when the student redraws the species in a different arrangement (for example after "this happens three times").
- "arrows": the curly arrows of this step, in order (may be empty).
- "note": one short sentence in plain words about what happens (what attacks what, what leaves).
- "jump": true only for a step with no arrows that says something like "repeats 3 times" or "same on the other groups". The next step then restarts from its own "start".

ARROWS
Each arrow is {"kind":"pair" or "fishhook","from":...,"to":...}. Use "pair" for a full curly arrow (two electrons) and "fishhook" for a half arrow (one electron).
"from" is either {"type":"bond","atoms":[a,b]} (the electrons of the bond between mapped atoms a and b) or {"type":"lonepair","atom":a}.
"to" is one of:
- {"type":"atom","atom":c} the electrons end on atom c. If they come from a bond and form a NEW bond from one end of that bond to c, add "via": the map number of that end (for example a pi bond C2=C3 attacking B: "from" bond [2,3], "to" atom B with "via": 3). If they come from a lone pair, they form a bond from that atom to c. If the arrow ends on one of the two atoms of its own source bond, the bond breaks and that atom takes the electrons as a lone pair (no "via").
- {"type":"bond","atoms":[a,b]} the electrons go into the bond between a and b (for example a lone pair becoming a pi bond, or a pi bond shifting into the neighbouring bond).
The arrow tail is on the electron source, the head on where they go.

OUTPUT
{
 "name": "short name of the reaction, as on the page",
 "chapter": one of %%CHAPTERS%%,
 "reagents": "reagents as written, plain text, e.g. BH3 ; then H2O2",
 "conditions": "solvent, temperature, light, heat as written, or empty",
 "product": "name or formula of the final product(s)",
 "observation": "what you SEE or measure in the lab if the page says it (colour change, precipitate, gas, smell), else empty string. Never invent it",
 "colours": [{"of":"species or reagent as written","colour":"colour as written, e.g. purple, colourless, reddish-brown"}]  (only colours written on the page, else an empty list),
 "steps": [ ... ],
 "products": {"molecules": [SMILES of the final species, unmapped is fine], "note": "one short sentence"},
 "doubts": ["anything on the page you could not read or were unsure about"]
}
If the page shows several different reactions, import only the one the user names; if they name none, import the first complete one.`;

/* ---------- photo handling ---------- */
function loadImage(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file), im = new Image();
    im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('bad image')); }; im.src = u;
  });
}
function shrink(im, max, q) {
  const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
  const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', q);
}
async function prepPhoto(file) {
  const im = await loadImage(file);

}

    if (App.view === 'practice') { endPractice(false); return true; }

/* ===================================================================
   Shell: screens, sheets, home, settings, install, boot.
   =================================================================== */
const ic = p => `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  back: ic('<path d="M15 5l-7 7 7 7"/>'), close: ic('<path d="M6 6l12 12M18 6L6 18"/>'), edit: ic('<path d="M4 20h4L19 9l-4-4L4 16v4z"/>'),
  undo: ic('<path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 010 12" transform="translate(0 -6)"/>'), tidy: ic('<path d="M4 7h16M4 12h10M4 17h16"/>'),
  fit: ic('<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>'), play: ic('<path d="M8 5l11 7-11 7V5z" fill="currentColor"/>'), pause: ic('<path d="M8 5v14M16 5v14"/>'),

  gear: ic('<circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>'), trash: ic('<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>'), quiz: ic('<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 115 0c0 1.6-2.5 2-2.5 3.8M12 17.2v.1"/>'), photo: ic('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.2"/>'), book: ic('<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/><path d="M5 17a3 3 0 013-3h11"/>'), target: ic('<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".8" fill="currentColor"/>'), more: ic('<circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/>')
};
const SCREENS = ['home', 'edit', 'play', 'practice', 'settings'];
function applyScreens(name) { SCREENS.forEach(s => $('#v' + s[0].toUpperCase() + s.slice(1)).classList.toggle('on', s === name || (Split.on && name === 'play' && s === 'home'))); }
function show(name) { applyScreens(name); App.view = name; closeSheet(); window.scrollTo(0, 0); window.navSync && window.navSync(); }
function goHome() { show('home'); renderHome(); }

/* ---------- sheets (no alert/confirm/prompt) ---------- */
function openSheet(o) {
  closeSheet(); const host = $('#sheetHost');
  const sh = h('div', { class: 'sheet' + (o.wide ? ' wide' : ''), role: 'dialog', 'aria-modal': 'true' },
    h('div', { class: 'grab' }), h('h3', null, o.title), o.body ? h('p', { class: 'sub' }, o.body) : null, ...(o.nodes || []),
    h('div', { class: 'sheetact' }, ...(o.actions || [{ label: 'Close' }]).map(a => h('button', { class: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''), onclick: () => { closeSheet(); a.fn && a.fn(); } }, a.label))));
  host.replaceChildren(h('div', { class: 'scrim', onclick: closeSheet }), sh); host.classList.add('on'); window.navSync && window.navSync(); return sh;
}
function closeSheet() { const host = $('#sheetHost'); host.classList.remove('on'); host.replaceChildren(); window.navSync && window.navSync(); }

/* ---------- home ---------- */
function statusOf(m) { if (m.review) return { t: 'Check', c: 'draft' }; if (m.frames.length < 2) return { t: 'Draft', c: 'draft' }; if (!m.srs) return { t: 'New', c: 'new' }; if (isDue(m)) return { t: 'Due', c: 'due' }; const d = Math.max(1, Math.ceil((m.srs.due - Date.now()) / 864e5)); return { t: 'In ' + d + (d === 1 ? ' day' : ' days'), c: 'later' }; }
async function restoreSeeds() { for (const f of [seedHydroboration, seedOzonolysis]) { const m = f(); const ex = App.byId(m.id); if (ex) { m.srs = ex.srs; if (ex.folder && Folders.get(ex.folder)) m.folder = ex.folder; } await App.save(m, true); } renderHome(); toast('Starter mechanisms restored'); }
async function exportBackup() {
  const data = JSON.stringify({ app: 'curly', v: 3, exported: new Date().toISOString(), folders: Folders.list, mechanisms: App.mechs, profile: App.profile });
  const name = 'curly-backup-' + dayKey() + '.json'; const blob = new Blob([data], { type: 'application/json' });
  try {
    if (window.claude && window.claude.use) { const dl = await window.claude.use('downloads'); await dl.save(name, data, 'application/json'); }
    else { const a = h('a', { href: URL.createObjectURL(blob), download: name }); document.body.append(a); a.click(); a.remove(); }
    toast('Backup downloaded');
  } catch (e) { toast('Could not download the backup'); }
}
async function importBackup(file) {
  try {
    const o = JSON.parse(await file.text()); if (o.app !== 'curly' || !Array.isArray(o.mechanisms)) throw new Error('not a backup');
    if (Array.isArray(o.folders)) { let added = 0; for (const f of o.folders) { if (f && f.id && f.name && !Folders.get(f.id)) { Folders.list.push({ id: String(f.id), name: String(f.name).slice(0, 60), parent: f.parent || null, color: f.color || 'blue', ord: f.ord || 0 }); added++; } } if (added) { Folders.list.forEach(f => { if (f.parent && !Folders.get(f.parent)) f.parent = null; }); await Folders.save(); } }
    const good = o.mechanisms.filter(m => m && m.id && Array.isArray(m.frames)); for (const m of good) { ensureLayout(m); await App.save(m, true); }
    await migrateFolders(good.map(m => App.byId(m.id)).filter(Boolean));
    const P = App.profile, B = o.profile || {};
    if (B.days) { P.days = P.days || {}; for (const k in B.days) P.days[k] = Math.max(P.days[k] || 0, B.days[k]); }
    if (B.quiz) { P.quiz = P.quiz || {}; for (const k in B.quiz) { const a = P.quiz[k], b = B.quiz[k]; if (b && (!a || (b.t || 0) > (a.t || 0))) P.quiz[k] = { r: b.r || 0, t: b.t || 0 }; } }
    if (Array.isArray(B.qhist)) { const seen = new Set((P.qhist || []).map(x => x.ts)); P.qhist = (P.qhist || []).concat(B.qhist.filter(x => x && x.ts && !seen.has(x.ts))).sort((a, b) => a.ts - b.ts).slice(-60); }
    await DB.setMeta('profile', P);
    renderHome(); toast('Backup restored');
  } catch (e) { toast('That file is not a Curly backup.'); }
}

/* ---------- install as an app (standalone copy only) ---------- */
function initPwa() {
  if (window.claude || !/^https?:$/.test(location.protocol)) return;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); App.installEvt = e; });
  if (typeof ICONS !== 'undefined') {
    const base = location.href.split('#')[0].split('?')[0];
    const man = { id: base, name: 'Curly', short_name: 'Curly', lang: 'en', categories: ['education'], display_override: ['standalone', 'minimal-ui'], description: 'Learn organic reaction mechanisms by pushing the electrons yourself.', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone', orientation: 'any', background_color: '#151b30', theme_color: '#fbf7ea',
      icons: [{ src: ICONS.i192, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: ICONS.i512, sizes: '512x512', type: 'image/png', purpose: 'any' }, { src: ICONS.m512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
    const link = h('link', { rel: 'manifest', href: 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(man)) }); document.head.append(link);
    document.head.append(h('link', { rel: 'apple-touch-icon', href: ICONS.a180 }));
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}

/* ---------- boot ---------- */
async function boot() {
  $('#importFile').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f); });
  Split.init(); initPwa(); await DB.open(); await Folders.load();
  App.profile = (await DB.getMeta('profile')) || { days: {} };
  let list = await DB.all();
  if (!list.length && !(await DB.getMeta('seeded'))) {
    for (const f of [seedHydroboration, seedOzonolysis]) { try { const m = f(); await DB.put(m); list.push(m); } catch (e) { console.error(e); } }
    await DB.setMeta('seeded', 1);
  }
  if ((await DB.getMeta('seedv')) !== 4) {
    for (const f of [seedHydroboration, seedOzonolysis]) { try { const m = f(), i = list.findIndex(x => x.id === m.id); if (i >= 0 && list[i].seed) { m.srs = list[i].srs; m.miss = list[i].miss || {}; if (list[i].folder && Folders.get(list[i].folder)) m.folder = list[i].folder; list[i] = m; await DB.put(m); } } catch (e) { console.error(e); } }
    await DB.setMeta('seedv', 4);
  }
  await migrateFolders(list);
  for (const m of list) { if (m.lv !== 2) { ensureLayout(m); try { await DB.put(m); } catch (e) { /* keep going */ } } }
  App.mechs = list; await Folders.save(); goHome(); window.__ready = true;
}
boot();
